syntax = "proto3";

package tradingcopilot.v1;

import "google/protobuf/any.proto";

// Inputs for a single C++ strategy run (protojson --config).
message RunEnvelope {
  uint32 schema_version = 1;
  string label = 2;
  string provider = 3;
  string base = 4;
  string quote = 5;
  int64 from_ms = 6;
  int64 to_ms = 7;
  double initial_quote = 8;
  google.protobuf.Any payload = 9;
}
