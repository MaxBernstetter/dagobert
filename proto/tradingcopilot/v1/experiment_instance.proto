syntax = "proto3";

package tradingcopilot.v1;

import "tradingcopilot/v1/strategy.proto";

// InstanceMetrics maps to experiment_instance.metric_* columns.
message InstanceMetrics {
  optional int64 duration_ms = 1;
  optional double cagr = 2;
  optional double max_drawdown = 3;
  optional double sharpe = 4;
  optional double sortino = 5;
  optional double monthly_return_avg = 6;
  optional double monthly_return_med = 7;
  optional double yearly_return_avg = 8;
  optional double yearly_return_med = 9;
  optional double trades_per_month_avg = 10;
  optional double trades_per_month_med = 11;
  optional float win_rate = 12;
  optional float monthly_win_rate_avg = 13;
  optional float monthly_win_rate_med = 14;
  optional float yearly_win_rate_avg = 15;
  optional float yearly_win_rate_med = 16;
  optional int32 wins = 17;
  optional int32 losses = 18;
  optional int32 breakeven = 19;
}

// ExperimentInstance is the full relational row for public.experiment_instance.
message ExperimentInstance {
  string id = 1;
  string experiment_id = 2;
  string label = 3;
  string playbook = 4;
  string symbol = 5;
  string config_hash = 6;
  string playbook_key = 7;
  string workspace_rel_path = 8;
  string status = 9;
  string error = 10;
  optional int64 started_at_ms = 11;
  optional int64 finished_at_ms = 12;

  // Strategy columns (cfg_*).
  optional int32 cfg_fast_hr = 20;
  optional int32 cfg_slow_hr = 21;
  optional double cfg_rsi_bull = 22;
  optional double cfg_rsi_bear = 23;
  optional double cfg_vol_ratio_bull = 24;
  optional double cfg_vol_ratio_bear = 25;
  optional double cfg_atr_stop_mult = 26;
  optional int32 cfg_min_bars_flat_after_sell = 27;
  optional int32 cfg_min_bars_long_before_sell = 28;

  InstanceMetrics metrics = 40;

  // Convenience nested view for API clients (derived from cfg_*).
  MaCrossConfig ma_cross = 50;
  SignalConsensusConfig signal_consensus = 51;
}

message ListInstancesRequest {
  string experiment_id = 1;
  string cursor = 2;
  int32 limit = 3;
  string status = 4;
  string symbol = 5;
  string q = 6;
  string sort = 7;
  string order = 8;
}

message ListInstancesResponse {
  repeated ExperimentInstance instances = 1;
  int64 total = 2;
  optional string next_cursor = 3;
  int32 limit = 4;
}
