syntax = "proto3";

package tradingcopilot.v1;

// public.experiment_instance_period_stat
message ExperimentInstancePeriodStat {
  string instance_id = 1;
  string period_kind = 2; // monthly | yearly
  string period_key = 3;
  optional double return_pct = 4;
  optional int32 trade_count = 5;
  optional int32 win_count = 6;
}

// public.experiment_instance_action
message ExperimentInstanceAction {
  string id = 1;
  string experiment_id = 2;
  string instance_id = 3;
  string symbol = 4;
  int64 bar_open_ms = 5;
  string side = 6; // buy | sell | flat | other
  optional double weight_pct = 7;
  string reason = 8;
  // Sizing fields of a sized decision (src/calculation-signal/playbooks/position-sizing/DESCRIPTION.md);
  // unset for unsized actions. Same names as the live signal body.
  optional double quote_notional = 9; // buy: quote requested, before the cash clamp
  optional double base_qty = 10;      // vol_cut: base to sell
  optional double stop_price = 11;    // buy: stop of the new unit
  optional double raise_stops_by = 12; // pyramid: earlier stops move up by this
  // Book equity (quote) at the decision bar close; rescales sized notionals.
  optional double equity = 13;
  // vol_cut: base the heat budget allows per unit of equity, heat_pct/100 /
  // (stop_atr_mult * atr). The cut is held - equity * this, so a replay on a
  // different wallet recomputes it instead of rescaling base_qty.
  optional double heat_base_per_equity = 14;
}

// public.experiment_instance_fill
message ExperimentInstanceFill {
  string id = 1;
  string experiment_id = 2;
  string instance_id = 3;
  optional string action_id = 4;
  string symbol = 5;
  int64 ts_ms = 6;
  string side = 7;
  double qty = 8;
  double price = 9;
  double fee = 10;
  string fee_asset = 11;
}

message ListActionsResponse {
  repeated ExperimentInstanceAction actions = 1;
}

message ListFillsResponse {
  repeated ExperimentInstanceFill fills = 1;
}

message ListPeriodStatsResponse {
  repeated ExperimentInstancePeriodStat stats = 1;
}
