# Long-running stack: Floci, the orchestrator, and the web app.
# Job images are started by the orchestrator. They are not services here.
# HOST_DATA_DIR, HOST_PLAYBOOKS_DIR, and HOST_SECRETS_FILE are host paths
# because the orchestrator talks to the host Docker socket.

services:
  floci:
    image: floci/floci:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
    image: trading-copilot-orchestrator
    environment:
      SFN_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      HOST_DATA_DIR: ${HOST_DATA_DIR:?set HOST_DATA_DIR}
      HOST_PLAYBOOKS_DIR: ${HOST_PLAYBOOKS_DIR:?set HOST_PLAYBOOKS_DIR}
      HOST_SECRETS_FILE: ${HOST_SECRETS_FILE:?set HOST_SECRETS_FILE}
      SECRETS_FILE: /secrets/.secrets
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://data-api.binance.vision}
      LIVE_DIR: /data
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_SECRETS_FILE}:/secrets/.secrets:ro
      - ./data:/data
    depends_on:
      - floci
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: trading-copilot-web
    environment:
      DATA_DIR: /data
      ORCHESTRATOR_URL: http://orchestrator:8090
    ports:
      - "${WEB_PORT:-3001}:3000"
    volumes:
      - ./data:/data
    restart: unless-stopped
