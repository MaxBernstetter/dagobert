# The local stack is Floci only: Aurora, S3, SSM, Secrets Manager, Lambda, Step Functions, ECS and CloudFront,
# all provisioned by Terraform (infra/terraform, task infra:local). The jobs run on Floci as ECS tasks and Step
# Functions executions; nothing runs as a compose service.

name: dagobert

services:
  floci:
    image: floci/floci:latest
    ports:
      - "127.0.0.1:${FLOCI_PORT:-11566}:4566"
      # Aurora proxy ports (Terraform pins the cluster to 7001).
      - "127.0.0.1:7001-7099:7001-7099"
    environment:
      FLOCI_HOSTNAME: floci
      # Floci starts the Aurora container itself, on this compose network, advertised as "floci".
      FLOCI_SERVICES_DOCKER_NETWORK: dagobert_default
      FLOCI_SERVICES_RDS_ENDPOINT_HOST: floci
      # The CloudFront distribution's origins are 127.0.0.1 (the API Gateway and the S3 bucket,
      # both inside Floci). Floci refuses private origin hosts unless they are allowed here.
      FLOCI_SERVICES_CLOUDFRONT_ALLOWED_PRIVATE_ORIGIN_HOSTS: "127.0.0.1"
    # Floci starts the Aurora, ECS task and Lambda containers through the host Docker daemon.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
