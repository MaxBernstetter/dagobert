# Merged automatically by `docker compose up` / `task up` (local dev).
# Serves the Vite SPA from src/frontend.
# Production SPA image only: COMPOSE_FILE=compose.yaml docker compose up

services:
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      target: dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      VITE_EXPERIMENT_API_URL: ${VITE_EXPERIMENT_API_URL:-}
      VITE_DEV_API_PROXY: ${VITE_DEV_API_PROXY:-http://orchestrator:8090}
    volumes:
      - ./src/frontend:/repo/src/frontend
      # Keep the image's node_modules; the bind mount above would hide them (vite: not found).
      - /repo/src/frontend/node_modules
      - ./src/calculation-technical-indicator:/repo/src/calculation-technical-indicator:ro
      - ./src/calculation-signal:/repo/src/calculation-signal:ro
    develop:
      watch:
        - action: sync
          path: ./src/frontend
          target: /repo/src/frontend
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./src/frontend/package.json
        - action: rebuild
          path: ./src/frontend/package-lock.json
        - action: rebuild
          path: ./src/frontend/Dockerfile
