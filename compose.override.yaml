# Merged automatically by `docker compose up` (local dev).
# Production frontend only: COMPOSE_FILE=compose.yaml docker compose up

services:
  frontend:
    build:
      target: dev
    command: ["npm", "run", "dev:docker"]
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
      # Keep .next off the host bind mount (avoids corrupt / mixed turbopack caches).
      - frontend_next:/app/.next
    develop:
      watch:
        - action: sync
          path: ./src/frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./src/frontend/package.json
        - action: rebuild
          path: ./src/frontend/package-lock.json
        - action: rebuild
          path: ./src/frontend/Dockerfile

volumes:
  frontend_node_modules:
  frontend_next:
