version: "3"

dotenv: ['.env']

vars:
  HOST_DATA_DIR: "{{.ROOT_DIR}}/data"

env:
  DOCKER_BUILDKIT: "1"

tasks:
  cpp:deps:
    desc: Build the shared C++ dependency prefix once (PRESET=debug|optimized); needed before configuring src/calculation
    cmds:
      - NIX_ENFORCE_NO_NATIVE=0 src/calculation/deps/build.sh {{.PRESET | default "debug"}}

  cpp:build:
    desc: Configure and build src/calculation (PRESET=debug|optimized); one build per build dir at a time
    cmds:
      # Local builds are host-tuned: the Nix clang wrapper (NIX_ENFORCE_NO_NATIVE=1) would drop -march=native.
      # Container images stay portable (DAGOBERT_PORTABLE=ON, see src/calculation/README.md).
      - NIX_ENFORCE_NO_NATIVE=0 cmake --preset {{.PRESET | default "debug"}} -S src/calculation
      - NIX_ENFORCE_NO_NATIVE=0 flock build/{{.PRESET | default "debug"}}.lock cmake --build build/{{.PRESET | default "debug"}}

  cpp:test:
    desc: Run the C++ tests (PRESET=debug|optimized)
    cmds:
      - task: cpp:build
      - ctest --test-dir build/{{.PRESET | default "debug"}} --output-on-failure

  cpp:iwyu:
    desc: Report include-what-you-use findings for src/calculation (report only, PRESET=debug|optimized)
    cmds:
      - cmake --preset {{.PRESET | default "debug"}} -S src/calculation
      - PRESET={{.PRESET | default "debug"}} scripts/cpp-iwyu.sh report

  cpp:iwyu:check:
    desc: Fail on unnecessary includes not in src/calculation/iwyu-baseline.txt (PRESET=debug|optimized)
    cmds:
      - cmake --preset {{.PRESET | default "debug"}} -S src/calculation
      - PRESET={{.PRESET | default "debug"}} scripts/cpp-iwyu.sh check

  cpp:iwyu:baseline:
    desc: Regenerate src/calculation/iwyu-baseline.txt from the current unnecessary includes (PRESET=debug|optimized)
    cmds:
      - cmake --preset {{.PRESET | default "debug"}} -S src/calculation
      - PRESET={{.PRESET | default "debug"}} scripts/cpp-iwyu.sh baseline

  data:migrate-candles:
    desc: Rewrite legacy string candle files under DATA_DIR (default ./data) in the decimal schema; idempotent, verified, atomic
    cmds:
      - go run ./src/cmd/migrate-candles {{.DATA_DIR | default "./data"}}

  data:migrate-ingest-ledger:
    desc: Copy DATA_DIR/ingest.sqlite (default ./data) into the Postgres ingest ledger; idempotent
    env:
      DATABASE_URL: '{{.DATABASE_URL | default (printf "postgres://trading:trading@127.0.0.1:%s/trading?sslmode=require&search_path=public" (.DATABASE_PORT | default "7001"))}}'
    cmds:
      - go run ./src/cmd/migrate-ingest-ledger {{.DATA_DIR | default "./data"}}

  build:jobs:
    desc: Build the job images (ingest, technical indicators, backtest)
    cmds:
      - docker build -f docker/ingest/Dockerfile -t dagobert-ingest .
      - docker build -f docker/calculation-technical-indicator/Dockerfile -t dagobert-calculation-technical-indicator .
      - docker build -f docker/backtest/Dockerfile -t dagobert-backtest .

  build:api-lambda:
    desc: Build the Experiment API Lambda image (API Gateway HTTP API backend)
    cmds:
      - docker build -f docker/experiment-api/Dockerfile -t dagobert-experiment-api-lambda .

  build:
    desc: Build the job images (task build:jobs); the Lambda and worker images are built by task infra:local
    cmds:
      - task: build:jobs

  up:
    desc: Start Floci, then apply Terraform (Aurora, S3, SSM, Secrets Manager, API, web app) and the migrations
    cmds:
      - mkdir -p data/parquet
      - docker compose up -d --wait floci
      - task: db:migrate

  up:build:
    desc: Build the job images, then task up
    cmds:
      - task: build
      - task: up

  dev:
    desc: "Same as task up. The web app runs on the host (task frontend:dev)"
    cmds:
      - task: up
      - echo "Floci is up. Start the web app with task frontend:dev (http://localhost:3000)."

  frontend:dev:
    desc: Vite dev server with hot reload on the host (port 3000), proxying /tradingcopilot.v1. to the Floci API Gateway (needs task infra:local)
    dir: src/frontend
    cmds:
      - |
        API="$(../../scripts/local-api-url.sh)"
        export VITE_DEV_API_PROXY="$(printf '%s\n' "$API" | head -n1)"
        export VITE_DEV_API_PREFIX="$(printf '%s\n' "$API" | tail -n1)"
        npm run dev

  down:
    desc: Stop Floci (the compose stack). Leaves ./data in place
    cmds:
      - docker compose down

  test:
    desc: System-test the job images
    cmds:
      - go test ./tests/system/ingest ./tests/system/calculation-technical-indicator ./tests/system/backtest ./tests/system/experiment -count=1 -timeout 20m

  seed-demo-year:
    desc: Wipe data/, backfill 1y BTC and replay ma-cross over it with the simulated venue
    cmds:
      - mkdir -p data/parquet
      - go run ./src/cmd/seed-demo-year

  lake:upload:
    desc: Copy an existing ./data/parquet lake into the Floci S3 bucket (one-off, after switching LAKE_BACKEND to s3)
    cmds:
      - |
        docker run --rm --network host -e AWS_ACCESS_KEY_ID=test -e AWS_SECRET_ACCESS_KEY=test -e AWS_DEFAULT_REGION=us-east-1 \
          -v "{{.HOST_DATA_DIR}}/parquet:/lake:ro" amazon/aws-cli \
          --endpoint-url "http://127.0.0.1:{{.FLOCI_PORT | default "11566"}}" \
          s3 sync /lake "s3://${LAKE_BUCKET:-dagobert-local-lake}/parquet"

  backtest-run:
    desc: Run one catalogued backtest (BACKTEST_ID=uuid, uses dagobert-backtest image)
    cmds:
      - docker run --rm -e DATA_DIR=/data -e BACKTEST_ID={{.BACKTEST_ID}} -e VENUE_SIMULATE=1 -v "{{.HOST_DATA_DIR}}:/data" dagobert-backtest

  experiment-run:
    desc: Run one multi-instance experiment (EXPERIMENT_ID=uuid, uses dagobert-backtest image)
    cmds:
      - docker run --rm -e DATA_DIR=/data -e EXPERIMENT_ID={{.EXPERIMENT_ID}} -e VENUE_SIMULATE=1 {{if .EXPERIMENT_SIM_WORKERS}}-e EXPERIMENT_SIM_WORKERS={{.EXPERIMENT_SIM_WORKERS}}{{end}} -e AWS_ENDPOINT_URL={{.AWS_ENDPOINT_URL | default ""}} -e LAKE_BUCKET={{.LAKE_BUCKET | default ""}} -e EXPERIMENT_ARTIFACTS={{.EXPERIMENT_ARTIFACTS | default "fs"}} -v "{{.HOST_DATA_DIR}}:/data" dagobert-backtest

  infra:apply:
    desc: Terraform apply. ENV=local (default, Floci) or prod (real AWS, CI only)
    cmds:
      - scripts/infra-apply.sh {{.ENV | default "local"}}

  infra:local:
    desc: Apply Terraform against Floci (VPC, Aurora, S3, CloudFront, SSM, IAM), then upload the web app
    cmds:
      - scripts/infra-apply.sh local

  infra:prod:
    desc: Apply Terraform to real AWS. Refuses outside CI (CI=true and AWS credentials required)
    cmds:
      - scripts/infra-apply.sh prod

  db:up:
    desc: Apply Terraform on Floci (creates the Aurora cluster), then create the roles the migrations revoke from
    cmds:
      - task: infra:local
      - |
        for role in anon authenticated; do
          docker run --rm --network host -e PGPASSWORD="${POSTGRES_PASSWORD:-trading}" -e PGSSLMODE=require postgres:16-alpine \
            psql -h 127.0.0.1 -p {{.DATABASE_PORT | default "7001"}} -U "${POSTGRES_USER:-trading}" -d "${POSTGRES_DB:-trading}" -v ON_ERROR_STOP=1 -tAc \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='$role') THEN CREATE ROLE $role NOLOGIN; END IF; END \$\$"
        done

  db:diff:
    desc: Atlas — edit HCL then generate a migration (name=… optional)
    dir: db
    env:
      DATABASE_URL: '{{.DATABASE_URL | default (printf "postgres://trading:trading@127.0.0.1:%s/trading?sslmode=require&search_path=public" (.DATABASE_PORT | default "7001"))}}'
    cmds:
      - |
        ATLAS="{{.ATLAS | default ""}}"
        if [ -z "$ATLAS" ]; then
          if command -v atlas >/dev/null 2>&1; then ATLAS=atlas
          elif [ -x "$HOME/.local/bin/atlas" ]; then ATLAS="$HOME/.local/bin/atlas"
          else echo "atlas CLI not found (install Atlas OSS)" >&2; exit 1
          fi
        fi
        NAME="{{.name | default "schema"}}"
        "$ATLAS" migrate diff "$NAME" --env local

  db:sqlc:
    desc: Regenerate sqlc Go queries (db/sqlc → src/experimentapi/experimentdb)
    dir: db/sqlc
    cmds:
      - |
        SQLC="{{.SQLC | default ""}}"
        if [ -z "$SQLC" ]; then
          if command -v sqlc >/dev/null 2>&1; then SQLC=sqlc
          elif [ -x "$HOME/.local/bin/sqlc" ]; then SQLC="$HOME/.local/bin/sqlc"
          else echo "sqlc CLI not found" >&2; exit 1
          fi
        fi
        "$SQLC" generate

  proto:lint:
    desc: Buf lint for proto/
    dir: proto
    cmds:
      - |
        BUF="{{.BUF | default ""}}"
        if [ -z "$BUF" ]; then
          if command -v buf >/dev/null 2>&1; then BUF=buf
          elif [ -x "$HOME/.local/bin/buf" ]; then BUF="$HOME/.local/bin/buf"
          else echo "buf CLI not found" >&2; exit 1
          fi
        fi
        "$BUF" lint

  proto:gen:
    desc: Buf generate Go + TS from proto/
    dir: proto
    cmds:
      - |
        BUF="{{.BUF | default ""}}"
        if [ -z "$BUF" ]; then
          if command -v buf >/dev/null 2>&1; then BUF=buf
          elif [ -x "$HOME/.local/bin/buf" ]; then BUF="$HOME/.local/bin/buf"
          else echo "buf CLI not found" >&2; exit 1
          fi
        fi
        "$BUF" generate
      - |
        echo "Go → src/gen/tradingcopilot/v1 ; TS → src/frontend/src/lib/gen/tradingcopilot/v1"

  proto:breaking:
    desc: Buf breaking check against main (or BSR if pushed)
    dir: proto
    cmds:
      - |
        BUF="{{.BUF | default ""}}"
        if [ -z "$BUF" ]; then
          if command -v buf >/dev/null 2>&1; then BUF=buf
          elif [ -x "$HOME/.local/bin/buf" ]; then BUF="$HOME/.local/bin/buf"
          else echo "buf CLI not found" >&2; exit 1
          fi
        fi
        "$BUF" breaking --against '../.git#branch=main,subdir=proto' || \
          "$BUF" breaking --against '.git#branch=main' || \
          echo "breaking: skipped (no baseline on main yet — first push establishes it)"

  proto:push:
    desc: Push schemas to Buf Schema Registry (buf registry login first)
    dir: proto
    cmds:
      - |
        BUF="{{.BUF | default ""}}"
        if [ -z "$BUF" ]; then
          if command -v buf >/dev/null 2>&1; then BUF=buf
          elif [ -x "$HOME/.local/bin/buf" ]; then BUF="$HOME/.local/bin/buf"
          else echo "buf CLI not found" >&2; exit 1
          fi
        fi
        "$BUF" push --label v0.1.0

  db:migrate:
    desc: "Atlas — apply migrations to DATABASE_URL (default Aurora on Floci, created by Terraform)"
    dir: db
    deps: [db:up]
    env:
      DATABASE_URL: '{{.DATABASE_URL | default (printf "postgres://trading:trading@127.0.0.1:%s/trading?sslmode=require&search_path=public" (.DATABASE_PORT | default "7001"))}}'
    cmds:
      - |
        ATLAS="{{.ATLAS | default ""}}"
        if [ -z "$ATLAS" ]; then
          if command -v atlas >/dev/null 2>&1; then ATLAS=atlas
          elif [ -x "$HOME/.local/bin/atlas" ]; then ATLAS="$HOME/.local/bin/atlas"
          else echo "atlas CLI not found (install Atlas OSS)" >&2; exit 1
          fi
        fi
        "$ATLAS" migrate apply --env local
      - |
        echo "Applied. Revisions in schema atlas; app tables in public."

  db:migrate:ecs:
    desc: "Atlas — apply migrations as a one-off ECS task inside the VPC (Floci; prod runs scripts/db-migrate.sh prod from CI)"
    deps: [infra:local]
    cmds:
      - scripts/db-migrate.sh local
