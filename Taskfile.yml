version: "3"

dotenv: ['.env']

vars:
  HOST_DATA_DIR: "{{.ROOT_DIR}}/data"
  HOST_PLAYBOOKS_DIR: "{{.ROOT_DIR}}/src/calculation-signal/playbooks"
  HOST_SECRETS_FILE: "{{.ROOT_DIR}}/.secrets"

env:
  DOCKER_BUILDKIT: "1"
  COMPOSE_BAKE: "true"
  HOST_DATA_DIR: "{{.HOST_DATA_DIR}}"
  HOST_PLAYBOOKS_DIR: "{{.HOST_PLAYBOOKS_DIR}}"
  HOST_SECRETS_FILE: "{{.HOST_SECRETS_FILE}}"
  HOST_UID:
    sh: id -u
  HOST_GID:
    sh: id -g

tasks:
  cpp:deps:
    desc: Build the shared C++ dependency prefix once (PRESET=debug|optimized); needed before configuring src/calculation
    cmds:
      - src/calculation/deps/build.sh {{.PRESET | default "debug"}}

  cpp:build:
    desc: Configure and build src/calculation (PRESET=debug|optimized); one build per build dir at a time
    cmds:
      - cmake --preset {{.PRESET | default "debug"}} -S src/calculation
      - flock build/{{.PRESET | default "debug"}}.lock cmake --build build/{{.PRESET | default "debug"}}

  cpp:test:
    desc: Run the C++ tests (PRESET=debug|optimized)
    cmds:
      - task: cpp:build
      - ctest --test-dir build/{{.PRESET | default "debug"}} --output-on-failure

  cpp:iwyu:
    desc: Report include-what-you-use findings for src/calculation (report only, PRESET=debug|optimized)
    cmds:
      - cmake --preset {{.PRESET | default "debug"}} -S src/calculation
      - PRESET={{.PRESET | default "debug"}} scripts/cpp-iwyu.sh report

  cpp:iwyu:check:
    desc: Fail on unnecessary includes not in src/calculation/iwyu-baseline.txt (PRESET=debug|optimized)
    cmds:
      - cmake --preset {{.PRESET | default "debug"}} -S src/calculation
      - PRESET={{.PRESET | default "debug"}} scripts/cpp-iwyu.sh check

  cpp:iwyu:baseline:
    desc: Regenerate src/calculation/iwyu-baseline.txt from the current unnecessary includes (PRESET=debug|optimized)
    cmds:
      - cmake --preset {{.PRESET | default "debug"}} -S src/calculation
      - PRESET={{.PRESET | default "debug"}} scripts/cpp-iwyu.sh baseline

  data:migrate-candles:
    desc: Rewrite legacy string candle files under DATA_DIR (default ./data) in the decimal schema; idempotent, verified, atomic
    cmds:
      - go run ./src/cmd/migrate-candles {{.DATA_DIR | default "./data"}}

  build:jobs:
    desc: Build the four pipeline job images (orchestrator starts these)
    cmds:
      - docker build -f docker/ingest/Dockerfile -t dagobert-ingest .
      - docker build -f docker/calculation-technical-indicator/Dockerfile -t dagobert-calculation-technical-indicator .
      - docker build -f docker/calculation-signal/Dockerfile -t dagobert-calculation-signal .
      - docker build -f docker/calculation-market-action/Dockerfile -t dagobert-calculation-market-action .
      - docker build -f docker/execution/Dockerfile -t dagobert-execution .
      - docker build -f docker/backtest/Dockerfile -t dagobert-backtest .

  build:stack:
    desc: Build compose images (orchestrator + production frontend)
    cmds:
      - docker compose build

  build:
    desc: Build job images and the compose stack
    cmds:
      - task: build:jobs
      - task: build:stack

  up:
    desc: Start Floci, the orchestrator, and the web app (run task build once for job images)
    cmds:
      - mkdir -p data/parquet
      - task: ensure-secrets
      - docker compose up

  up:build:
    desc: Build everything, then start the stack (production frontend)
    cmds:
      - mkdir -p data/parquet
      - task: ensure-secrets
      - task: build
      - docker compose up

  up:prod:
    desc: Stack without compose.override.yaml (production build in frontend image)
    env:
      COMPOSE_FILE: compose.yaml
    cmds:
      - mkdir -p data/parquet
      - task: ensure-secrets
      - docker compose build frontend
      - docker compose up

  dev:
    desc: Same as task up but builds the job and compose images, migrates the database, and runs compose file watch (sync/rebuild rules)
    cmds:
      - mkdir -p data/parquet
      - task: ensure-secrets
      - task: build:jobs
      - task: build:stack
      - task: db:migrate
      - docker compose up --watch

  ensure-secrets:
    internal: true
    desc: Empty .secrets file so Compose does not create a directory on a missing bind mount
    cmds:
      - |
        secrets="{{.HOST_SECRETS_FILE}}"
        if [ -d "$secrets" ] && [ -z "$(ls -A "$secrets")" ]; then
          rmdir "$secrets"
        fi
        if [ ! -e "$secrets" ]; then
          touch "$secrets"
        fi

  frontend:deps:
    desc: Sync package-lock into the frontend container node_modules volume (after new npm deps)
    cmds:
      - docker compose exec -T frontend npm ci

  down:
    desc: Stop the stack. Leaves ./data in place
    cmds:
      - docker compose down

  run:
    desc: Start one state-machine execution for CANDLE_CLOSE_MS
    cmds:
      - docker compose exec -T -e CANDLE_CLOSE_MS={{.CANDLE_CLOSE_MS | default "1700006400000"}} orchestrator /orchestrator run

  test:
    desc: System-test the job images
    cmds:
      - go test ./tests/system/ingest ./tests/system/calculation-technical-indicator ./tests/system/calculation-signal ./tests/system/execution ./tests/system/backtest ./tests/system/experiment -count=1 -timeout 20m

  seed-demo-year:
    desc: Wipe data/, backfill 1y BTC, run ma-cross pipeline with simulated venue (no Bybit)
    cmds:
      - mkdir -p data/parquet
      - go run ./src/cmd/seed-demo-year

  backtest-run:
    desc: Run one catalogued backtest (BACKTEST_ID=uuid, uses dagobert-backtest image)
    cmds:
      - docker run --rm -e DATA_DIR=/data -e BACKTEST_ID={{.BACKTEST_ID}} -e VENUE_SIMULATE=1 -v "{{.HOST_DATA_DIR}}:/data" dagobert-backtest

  experiment-run:
    desc: Run one multi-instance experiment (EXPERIMENT_ID=uuid, uses dagobert-backtest image)
    cmds:
      - docker run --rm -e DATA_DIR=/data -e EXPERIMENT_ID={{.EXPERIMENT_ID}} -e VENUE_SIMULATE=1 {{if .EXPERIMENT_SIM_WORKERS}}-e EXPERIMENT_SIM_WORKERS={{.EXPERIMENT_SIM_WORKERS}}{{end}} -e AWS_ENDPOINT_URL={{.AWS_ENDPOINT_URL | default ""}} -e LAKE_BUCKET={{.LAKE_BUCKET | default ""}} -e EXPERIMENT_ARTIFACTS={{.EXPERIMENT_ARTIFACTS | default "fs"}} -v "{{.HOST_DATA_DIR}}:/data" dagobert-backtest

  infra:local:
    desc: Step 1 — apply Terraform against Floci (S3/SSM/IAM)
    cmds:
      - docker compose up -d floci
      - |
        export TF_VAR_supabase_access_token="${SUPABASE_ACCESS_TOKEN:-}"
        export TF_VAR_supabase_database_password="${SUPABASE_DB_PWD:-}"
        TF_IMG=hashicorp/terraform:1.9
        FLOCI_ENDPOINT="http://127.0.0.1:{{.FLOCI_PORT | default "11566"}}"
        if command -v terraform >/dev/null 2>&1; then
          (cd infra/terraform && terraform init -input=false && \
            terraform apply -input=false -auto-approve \
              -var='environment=local' -var='aws_region=us-east-1' \
              -var="floci_endpoint=${FLOCI_ENDPOINT}")
        else
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e TF_VAR_supabase_access_token \
            -e TF_VAR_supabase_database_password \
            -v "{{.ROOT_DIR}}/infra/terraform:/tf" -w /tf "$TF_IMG" init -input=false
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e TF_VAR_supabase_access_token \
            -e TF_VAR_supabase_database_password \
            -v "{{.ROOT_DIR}}/infra/terraform:/tf" -w /tf "$TF_IMG" apply -input=false -auto-approve \
            -var='environment=local' -var='aws_region=us-east-1' \
            -var="floci_endpoint=${FLOCI_ENDPOINT}"
        fi
      - |
        echo "Set in .env (defaults already in compose.yaml):"
        echo "  LAKE_BUCKET=dagobert-local-lake"
        echo "  SSM_PREFIX=/dagobert/local"
        echo "  EXPERIMENT_ARTIFACTS=s3   # optional step 3"

  infra:prod:
    desc: Apply Terraform for prod, including the Supabase project (.env SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PWD)
    cmds:
      - |
        if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PWD:-}" ]; then
          echo "Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PWD in .env" >&2
          exit 1
        fi
        if [ -z "${SUPABASE_ORGANIZATION_ID:-}" ]; then
          echo "Set SUPABASE_ORGANIZATION_ID in .env (dashboard org id)" >&2
          exit 1
        fi
        export TF_VAR_supabase_access_token="$SUPABASE_ACCESS_TOKEN"
        export TF_VAR_supabase_database_password="$SUPABASE_DB_PWD"
        TF_IMG=hashicorp/terraform:1.9
        TF_ARGS=(-input=false -auto-approve -var=environment=prod -var="supabase_organization_id=${SUPABASE_ORGANIZATION_ID}" -var="aws_region={{.AWS_REGION | default "eu-central-1"}}")
        if command -v terraform >/dev/null 2>&1; then
          (cd infra/terraform && terraform init -input=false && terraform apply "${TF_ARGS[@]}")
        else
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e TF_VAR_supabase_access_token \
            -e TF_VAR_supabase_database_password \
            -v "{{.ROOT_DIR}}/infra/terraform:/tf" -w /tf "$TF_IMG" init -input=false
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e TF_VAR_supabase_access_token \
            -e TF_VAR_supabase_database_password \
            -v "{{.ROOT_DIR}}/infra/terraform:/tf" -w /tf "$TF_IMG" apply "${TF_ARGS[@]}"
        fi

  infra:seed-ssm:
    desc: Step 2 — push .secrets BYBIT_* into Floci SSM
    cmds:
      - chmod +x scripts/seed-ssm-from-secrets.sh
      - ./scripts/seed-ssm-from-secrets.sh

  db:up:
    desc: Start Compose Postgres (control plane) and create the Supabase roles the migrations revoke from
    cmds:
      - docker compose up -d --wait postgres
      - |
        for role in anon authenticated; do
          docker compose exec -T postgres psql -U "${POSTGRES_USER:-trading}" -d "${POSTGRES_DB:-trading}" -tAc "SELECT 1 FROM pg_roles WHERE rolname='$role'" | grep -q 1 \
            || docker compose exec -T postgres psql -U "${POSTGRES_USER:-trading}" -d "${POSTGRES_DB:-trading}" -c "CREATE ROLE $role NOLOGIN"
        done

  db:diff:
    desc: Atlas — edit HCL then generate a migration (name=… optional)
    dir: db
    env:
      DATABASE_URL: '{{.DATABASE_URL | default (printf "postgres://trading:trading@127.0.0.1:%s/trading?sslmode=disable&search_path=public" (.POSTGRES_PORT | default "11432"))}}'
    cmds:
      - |
        ATLAS="{{.ATLAS | default ""}}"
        if [ -z "$ATLAS" ]; then
          if command -v atlas >/dev/null 2>&1; then ATLAS=atlas
          elif [ -x "$HOME/.local/bin/atlas" ]; then ATLAS="$HOME/.local/bin/atlas"
          else echo "atlas CLI not found (install Atlas OSS)" >&2; exit 1
          fi
        fi
        NAME="{{.name | default "schema"}}"
        "$ATLAS" migrate diff "$NAME" --env local

  db:sqlc:
    desc: Regenerate sqlc Go queries (db/sqlc → src/experimentapi/experimentdb)
    dir: db/sqlc
    cmds:
      - |
        SQLC="{{.SQLC | default ""}}"
        if [ -z "$SQLC" ]; then
          if command -v sqlc >/dev/null 2>&1; then SQLC=sqlc
          elif [ -x "$HOME/.local/bin/sqlc" ]; then SQLC="$HOME/.local/bin/sqlc"
          else echo "sqlc CLI not found" >&2; exit 1
          fi
        fi
        "$SQLC" generate

  proto:lint:
    desc: Buf lint for proto/
    dir: proto
    cmds:
      - |
        BUF="{{.BUF | default ""}}"
        if [ -z "$BUF" ]; then
          if command -v buf >/dev/null 2>&1; then BUF=buf
          elif [ -x "$HOME/.local/bin/buf" ]; then BUF="$HOME/.local/bin/buf"
          else echo "buf CLI not found" >&2; exit 1
          fi
        fi
        "$BUF" lint

  proto:gen:
    desc: Buf generate Go + TS from proto/
    dir: proto
    cmds:
      - |
        BUF="{{.BUF | default ""}}"
        if [ -z "$BUF" ]; then
          if command -v buf >/dev/null 2>&1; then BUF=buf
          elif [ -x "$HOME/.local/bin/buf" ]; then BUF="$HOME/.local/bin/buf"
          else echo "buf CLI not found" >&2; exit 1
          fi
        fi
        "$BUF" generate
      - |
        echo "Go → src/gen/tradingcopilot/v1 ; TS → src/frontend/src/lib/gen/tradingcopilot/v1"

  proto:breaking:
    desc: Buf breaking check against main (or BSR if pushed)
    dir: proto
    cmds:
      - |
        BUF="{{.BUF | default ""}}"
        if [ -z "$BUF" ]; then
          if command -v buf >/dev/null 2>&1; then BUF=buf
          elif [ -x "$HOME/.local/bin/buf" ]; then BUF="$HOME/.local/bin/buf"
          else echo "buf CLI not found" >&2; exit 1
          fi
        fi
        "$BUF" breaking --against '../.git#branch=main,subdir=proto' || \
          "$BUF" breaking --against '.git#branch=main' || \
          echo "breaking: skipped (no baseline on main yet — first push establishes it)"

  proto:push:
    desc: Push schemas to Buf Schema Registry (buf registry login first)
    dir: proto
    cmds:
      - |
        BUF="{{.BUF | default ""}}"
        if [ -z "$BUF" ]; then
          if command -v buf >/dev/null 2>&1; then BUF=buf
          elif [ -x "$HOME/.local/bin/buf" ]; then BUF="$HOME/.local/bin/buf"
          else echo "buf CLI not found" >&2; exit 1
          fi
        fi
        "$BUF" push --label v0.1.0

  db:migrate:
    desc: Atlas — apply migrations to DATABASE_URL (Compose Postgres)
    dir: db
    deps: [db:up]
    env:
      DATABASE_URL: '{{.DATABASE_URL | default (printf "postgres://trading:trading@127.0.0.1:%s/trading?sslmode=disable&search_path=public" (.POSTGRES_PORT | default "11432"))}}'
    cmds:
      - |
        ATLAS="{{.ATLAS | default ""}}"
        if [ -z "$ATLAS" ]; then
          if command -v atlas >/dev/null 2>&1; then ATLAS=atlas
          elif [ -x "$HOME/.local/bin/atlas" ]; then ATLAS="$HOME/.local/bin/atlas"
          else echo "atlas CLI not found (install Atlas OSS)" >&2; exit 1
          fi
        fi
        # Wait until Postgres accepts connections (healthcheck may still be starting).
        for i in $(seq 1 30); do
          if docker compose exec -T postgres pg_isready -U trading -d trading >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done
        "$ATLAS" migrate apply --env local
      - |
        echo "Applied. Revisions in schema atlas; app tables in public."

  db:migrate:supabase:
    desc: Atlas — apply db/migrations to SUPABASE_DB_URL (direct :5432 or session pooler)
    dir: db
    cmds:
      - |
        if [ -z "${SUPABASE_DB_URL:-}" ]; then
          echo "SUPABASE_DB_URL is unset. Set it to the Supabase Postgres URL (direct port 5432, or the session pooler on 5432 for IPv4). Do not use the transaction pooler (6543)." >&2
          exit 1
        fi
        ATLAS="{{.ATLAS | default ""}}"
        if [ -z "$ATLAS" ]; then
          if command -v atlas >/dev/null 2>&1; then ATLAS=atlas
          elif [ -x "$HOME/.local/bin/atlas" ]; then ATLAS="$HOME/.local/bin/atlas"
          else echo "atlas CLI not found (install Atlas OSS)" >&2; exit 1
          fi
        fi
        "$ATLAS" migrate apply --env supabase
      - |
        echo "Applied to Supabase. Revisions in schema atlas; app tables in public (anon/authenticated revoked)."
