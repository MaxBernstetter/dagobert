# yaml-language-server: $schema=../schemas/playbook.schema.json
name: ma-cross
rules:
  - id: above
    when:
      def:
        type: MovingAverage
        method: sma
        time_frame_hr: 3
      op: gt
      value: 100
    decision: buy
    size: 1
    exit:
      kind: time
      bars: 1
  - id: below
    when:
      def:
        type: MovingAverage
        method: sma
        time_frame_hr: 3
      op: lt
      value: 100
    decision: sell
    size: 1
    exit:
      kind: time
      bars: 1
